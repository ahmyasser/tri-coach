<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Tri Coach{% endblock %}</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1d1f23; --muted:#6b7078; --line:#e4e4e0;
          --swim:#2a78d6; --bike:#d9822b; --run:#1f9d62; --strength:#8a5cd1; --other:#8a8f98; --warn:#b54708; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141518; --card:#1c1e22; --text:#e8e8e6; --muted:#9a9ea6; --line:#2c2f35; --warn:#f79009; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:20px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); flex-wrap:wrap; }
  header b { font-size:16px; margin-right:12px; }
  header a { color:var(--muted); text-decoration:none; }
  header a.on { color:var(--text); font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:6px 0 16px; } h2 { font-size:16px; margin:0 0 12px; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; overflow-x:auto; }
  .stat .v { font-size:26px; font-weight:650; } .stat .l { color:var(--muted); font-size:13px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); } .warn { color:var(--warn); }
  .pill { display:inline-block; padding:1px 8px; border-radius:20px; font-size:12px; border:1px solid var(--line); }
  .swim{color:var(--swim)} .bike{color:var(--bike)} .run{color:var(--run)}
  canvas { max-height:300px; }
  a { color:var(--swim); }
  pre { white-space:pre-wrap; font-size:13px; margin:0; }
</style>
</head>
<body>
<header>
  <b>Tri Coach</b>
  <a href="/" class="{{ 'on' if page=='home' }}">Overview</a>
  <a href="/swim" class="{{ 'on' if page=='swim' }}">Swim</a>
  <a href="/activities" class="{{ 'on' if page=='activities' }}">Activities</a>
  <a href="/workouts" class="{{ 'on' if page=='workouts' }}">Workouts</a>
  <a href="/wellness" class="{{ 'on' if page=='wellness' }}">Wellness</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  if (window.Chart) {
    Chart.defaults.color = css('--muted');
    Chart.defaults.borderColor = css('--line');
    Chart.defaults.font.family = 'system-ui, sans-serif';
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
