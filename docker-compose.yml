services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tricoach
      POSTGRES_USER: tricoach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tricoach"]
      interval: 10s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tricoach:${POSTGRES_PASSWORD}@db:5432/tricoach
      GARMIN_TOKENSTORE: /data/garmin-tokens
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddydata:/data
    depends_on: [app]

volumes:
  pgdata:
  appdata:
  caddydata:
