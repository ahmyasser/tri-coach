[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tricoach"
version = "0.1.0"
description = "Personal triathlon training database synced from Garmin, with a dashboard and an MCP server for coaching with Claude"
requires-python = ">=3.12"
dependencies = [
    "garminconnect[workout]==0.3.20",
    "curl_cffi>=0.15.0",
    "mcp==2.3.0",
    "starlette>=1.0",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "tzdata",
    "anthropic>=2.3,<3",
    "itsdangerous>=2.1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tricoach = "tricoach.cli:main"

[tool.setuptools.packages.find]
include = ["tricoach*"]

[tool.setuptools.package-data]
tricoach = ["templates/*.html", "static/*"]
